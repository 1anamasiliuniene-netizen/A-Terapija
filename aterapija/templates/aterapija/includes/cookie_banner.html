{% load i18n %}
<div
        class="at-cookie-banner"
        id="cookie-banner"
>

    <div class="at-cookie-content">

        <h2 class="at-cookie-title">
            {% trans "Cookies and preferences" %}
        </h2>

        <p class="at-cookie-text">
            {% trans "We use cookies for sign-in and form security. You can also allow this browser to remember your day or evening theme." %}
        </p>

        <p class="at-cookie-links">

            <a href="{% url 'aterapija:privacy' %}">

                {% trans "Privacy Policy" %}

            </a>

            <span aria-hidden="true">•</span>

            <a href="{% url 'aterapija:cookies' %}">

                {% trans "Cookies Policy" %}

            </a>

        </p>

    </div>

    <div class="at-cookie-actions">

        <button class="at-btn at-btn-secondary" type="button" data-cookie-consent="necessary">

            {% trans "Only necessary" %}

        </button>

        <button class="at-btn at-btn-primary" type="button" data-cookie-consent="preferences">

            {% trans "Remember my theme" %}

        </button>

    </div>

</div>

<script>
    (function () {
        var storageKey = "aterapija-cookie-consent";
        var themeKey = "aterapija-theme";
        var banner = document.getElementById("cookie-banner");
        var settings = document.getElementById("cookie-settings");
        var necessaryButton = banner.querySelector('[data-cookie-consent="necessary"]');

        try {
            var consent = window.localStorage.getItem(storageKey);
            banner.hidden = consent === "necessary" || consent === "preferences";
        } catch (error) {
            // The choices remain available when browser storage is blocked.
        }

        settings.addEventListener("click", function (event) {
            event.preventDefault();
            banner.hidden = false;
            necessaryButton.focus();
        });

        banner.querySelectorAll("[data-cookie-consent]").forEach(function (button) {
            button.addEventListener("click", function () {
                var choice = button.dataset.cookieConsent;
                try {
                    if (choice === "necessary") {
                        window.localStorage.removeItem(themeKey);
                    }
                    window.localStorage.setItem(storageKey, choice);
                    if (choice === "preferences") {
                        window.localStorage.setItem(
                            themeKey,
                            document.documentElement.getAttribute("data-bs-theme")
                        );
                    }
                } catch (error) {
                    // The choice can still dismiss the banner for the current page.
                }
                banner.hidden = true;
                settings.focus();
            });
        });
    })();
</script>
