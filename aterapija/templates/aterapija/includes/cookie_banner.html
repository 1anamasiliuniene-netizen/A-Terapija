{% load i18n %}
<div
        class="at-cookie-banner"
        id="cookie-banner"
>

    <div class="at-cookie-content">

        <h2 class="at-cookie-title">
            {% trans "Cookies" %}
        </h2>

        <p class="at-cookie-text">
            {% blocktrans trimmed %}
                We use cookies to improve your experience, remember your preferences and analyse website usage.
                You can accept all cookies or manage your preferences.
            {% endblocktrans %}
        </p>

        <p class="at-cookie-links">

            <a href="{% url 'aterapija:privacy' %}">

                {% trans "Privacy Policy" %}

            </a>

            <span aria-hidden="true">•</span>

            <a href="{% url 'aterapija:cookies' %}">

                {% trans "Cookies Policy" %}

            </a>

        </p>

    </div>

    <div class="at-cookie-actions">

        <button class="at-btn at-btn-secondary" type="button" data-cookie-consent="necessary">

            {% trans "Only necessary" %}

        </button>

        <button class="at-btn at-btn-primary" type="button" data-cookie-consent="all">

            {% trans "Accept all" %}

        </button>

    </div>

</div>

<script>
    (function () {
        var storageKey = "aterapija-cookie-consent";
        var banner = document.getElementById("cookie-banner");

        if (!banner) {
            return;
        }

        try {
            if (window.localStorage.getItem(storageKey)) {
                banner.hidden = true;
                return;
            }
        } catch (error) {
            return;
        }

        banner.querySelectorAll("[data-cookie-consent]").forEach(function (button) {
            button.addEventListener("click", function () {
                try {
                    window.localStorage.setItem(storageKey, button.dataset.cookieConsent);
                } catch (error) {
                    // The banner should still close when storage is unavailable.
                }

                banner.hidden = true;
            });
        });
    })();
</script>
